name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  audit-and-lint:
    name: Repository Audit & Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Repository Cleanliness
        run: |
          echo "Checking for prohibited build artifacts..."
          FORBIDDEN=("node_modules" "dist" "build" "venv" ".venv" ".DS_Store")
          for item in "${FORBIDDEN[@]}"; do
            if [ -e "$item" ]; then
              echo "Error: Forbidden build artifact '$item' is present in repository!"
              exit 1
            fi
          done
          echo "Repository cleanliness audit passed: no build artifacts found."

      - name: Verify JavaScript Syntax & Lint
        run: npm run lint

  automated-tests:
    name: Unit Test Suite (Node ${{ matrix.node-version }})
    needs: audit-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Execute Automated Unit Tests
        run: npm test

      - name: Publish Test Summary
        if: always()
        run: |
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version**: ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suites**: Finance, SVG Charts, Schema Validation" >> $GITHUB_STEP_SUMMARY
