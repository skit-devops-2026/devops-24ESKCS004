name: Docker CI — Build & Push to Container Registries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: todo-practice

jobs:
  build-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Set up Docker Buildx ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Build image locally for testing ─────────────────────────
      - name: Build Docker image for testing
        run: docker build -t ${{ env.IMAGE_NAME }}:local .

      # ─── 4. Run tests inside the container ──────────────────────────
      - name: Run tests inside the container
        run: docker run --rm ${{ env.IMAGE_NAME }}:local npm test

      # ─── 5. Log in to Docker Hub (IMAGE 1/2) ─────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─── 6. Push IMAGE 1/2 → Docker Hub ──────────────────────────────
      - name: Push IMAGE 1/2 to Docker Hub
        run: |
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          docker tag ${{ env.IMAGE_NAME }}:local ${DH_USER}/${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:local ${DH_USER}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${DH_USER}/${{ env.IMAGE_NAME }}:latest
          docker push ${DH_USER}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "✅ IMAGE 1/2 — Pushed to Docker Hub: ${DH_USER}/${{ env.IMAGE_NAME }}:latest"

      # ─── 7. Log in to GHCR (IMAGE 2/2) ───────────────────────────────
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── 8. Push IMAGE 2/2 → GHCR ────────────────────────────────────
      - name: Push IMAGE 2/2 to GHCR
        run: |
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:local ${GHCR_IMAGE}:latest
          docker tag ${{ env.IMAGE_NAME }}:local ${GHCR_IMAGE}:${{ github.sha }}
          docker push ${GHCR_IMAGE}:latest
          docker push ${GHCR_IMAGE}:${{ github.sha }}
          echo "✅ IMAGE 2/2 — Pushed to GHCR: ${GHCR_IMAGE}:latest"
        continue-on-error: true   # GHCR org-level settings may restrict; Docker Hub is primary

      # ─── 9. Summary ──────────────────────────────────────────────────
      - name: Publish push summary
        if: always()
        run: |
          DH_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          echo "### 🐳 Docker Image Push Summary — Module 5 Containerization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Registry | Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **1/2** | Docker Hub | \`${DH_USER}/${{ env.IMAGE_NAME }}\` | \`:latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **2/2** | GHCR | \`ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}\` | \`:latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Student**: Aashi Goyal (24ESKCS004) | **Commit**: \`${{ github.sha }}\` | **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
