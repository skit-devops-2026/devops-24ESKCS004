name: Docker CI — Build & Push to Container Registries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DH: docker.io
  IMAGE_NAME: todo-practice

jobs:
  build-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Set up Docker Buildx ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Build image locally for testing ─────────────────────────
      - name: Build Docker image for testing
        run: docker build -t ${{ env.IMAGE_NAME }}:local .

      # ─── 4. Run tests inside the container ──────────────────────────
      - name: Run tests inside the container
        run: docker run --rm ${{ env.IMAGE_NAME }}:local npm test

      # ─── 5. Log in to GHCR ──────────────────────────────────────────
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── 6. Push IMAGE 1/2 → GHCR ───────────────────────────────────
      - name: Push IMAGE 1/2 to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

      - name: Confirm IMAGE 1/2 pushed
        run: echo "✅ IMAGE 1/2 — Pushed to GHCR ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest"

      # ─── 7. Log in to Docker Hub ────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_DH }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─── 8. Push IMAGE 2/2 → Docker Hub ─────────────────────────────
      - name: Push IMAGE 2/2 to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Confirm IMAGE 2/2 pushed
        run: echo "✅ IMAGE 2/2 — Pushed to Docker Hub ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

      # ─── 9. Summary ──────────────────────────────────────────────────
      - name: Publish push summary
        if: always()
        run: |
          echo "### 🐳 Docker Image Push Summary — Module 5 Containerization" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Registry | Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|-------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **1/2** ✅ | GHCR | \`ghcr.io/${{ github.repository_owner }}/todo-practice\` | \`:latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **2/2** ✅ | Docker Hub | \`${{ secrets.DOCKERHUB_USERNAME }}/todo-practice\` | \`:latest\`, \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Student**: Aashi Goyal (24ESKCS004) | **Commit**: \`${{ github.sha }}\` | **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
