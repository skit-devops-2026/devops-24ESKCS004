name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ─── 2. Configure GitHub Pages ───────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ─── 3. Upload static site as Pages artifact ─────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repo root (index.html, css/, js/, assets/ etc.)
          path: "."

      # ─── 4. Deploy to GitHub Pages ───────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ─── 5. Summary ──────────────────────────────────────────────────
      - name: Publish deployment summary
        run: |
          echo "### 🌐 GitHub Pages Deployment — Module 6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | ${{ steps.deployment.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Student**: Aashi Goyal (24ESKCS004)" >> $GITHUB_STEP_SUMMARY
