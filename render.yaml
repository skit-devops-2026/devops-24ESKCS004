services:
  - type: web
    name: devops-24eskcs004
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        fromDatabase:
          name: devops-24eskcs004-mongo
          property: connectionString
    healthCheckPath: /health

databases:
  - name: devops-24eskcs004-mongo
    plan: free
    databaseName: todos
