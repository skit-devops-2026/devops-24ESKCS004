global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "todo-app"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:5000"]
        labels:
          app: "todo-app"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
